[package]
name = "secret-manager"
version = "0.1.0"
edition = "2021"
description = "AES-256-GCM encrypted secret / dotfile vault CLI"
license = "MIT"
readme = "README.md"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
rpassword = "7"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
